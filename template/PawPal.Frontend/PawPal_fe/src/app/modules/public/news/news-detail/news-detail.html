<div class="news-detail-container">
  <app-navbar [roleId]="currentUser.roleid()"></app-navbar>

      @if (isLoaded() && news) {
        <div class="news-detail">
          <div class="news-detail-actions">
            <button class="secondarybtn" (click)="goBack()">← Back to News</button>
            @if (currentUser.roleid() === 3) {
              <div class="news-detail-admin-actions">
                <button class="primarybtn" (click)="openEditDialog()">Edit News</button>
                <button class="dangerbtn" (click)="deleteNews()">Delete News</button>
              </div>
            }
          </div>
          <img [src]="getImageUrl(news.photoURL)" class="news-detail-image" alt="{{ news.title }}" />
          <div class="news-detail-body">
            <h1>{{ news.title }}</h1>
            <span class="news-detail-date">{{ news.publishedAt | date: 'longDate' }}</span>
            <p class="news-detail-content">{{ news.content }}</p>
          </div>
        </div>
      } @else {
        <div class="news-detail-loading">
          <mat-spinner></mat-spinner>
        </div>
      }
    </div>
  } @else {
    <div class="news-detail-loading">
      <mat-spinner></mat-spinner>
    </div>
  }
</div>
<app-footer></app-footer>
